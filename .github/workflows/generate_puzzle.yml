name: Generate JumpCut Puzzles

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: generate-jumpcut-puzzles
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - uses: actions/cache/restore@v4
        with:
          path: pipeline/cache
          key: jumpcut-tmdb-cache-${{ github.run_id }}
          restore-keys: |
            jumpcut-tmdb-cache-

      - name: Install pipeline dependencies
        run: pip install -r pipeline/requirements.txt

      - name: Generate the next thirty-minute puzzle slot
        working-directory: pipeline
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          TMDB_BASE_URL: https://api.themoviedb.org/3
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python generate_puzzle.py

      - uses: actions/cache/save@v4
        if: always()
        with:
          path: pipeline/cache
          key: jumpcut-tmdb-cache-${{ github.run_id }}
